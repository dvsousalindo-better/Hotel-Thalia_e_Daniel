    <!-- Conteúdo -->
    <main class="container py-4 transition-main" id="swup">

        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">

                <div class="card shadow p-4">
                    <div class="card-body p-4">

                        <h1 class="h3 text-center mb-2">
                            Cálculo de Hospedagem
                        </h1>

                        <p class="text-muted text-center mb-4">
                            Calcule o valor da hospedagem de acordo
                            com o quarto, hóspedes e diárias.
                        </p>

                        <form id="formHospedagem">

                            <!-- Tipo de quarto -->
                            <div class="mb-3">
                                <label for="quarto" class="form-label">
                                    Tipo de quarto
                                </label>

                                <select id="quarto"
                                        class="form-select"
                                        required>

                                    <option value="">
                                        Selecione um quarto
                                    </option>

                                    <option value="individual">
                                        Individual — R$ 100
                                    </option>

                                    <option value="triplo">
                                        Triplo Luxo — R$ 150
                                    </option>

                                    <option value="duplo">
                                        Duplo — R$ 180
                                    </option>

                                    <option value="casal">
                                        Cama de Casal — R$ 200
                                    </option>

                                </select>
                            </div>

                            <!-- Pessoas -->
                            <div class="mb-3">
                                <label for="pessoas" class="form-label">
                                    Quantidade de pessoas
                                </label>

                                <input type="number"
                                        id="pessoas"
                                        class="form-control"
                                        min="1"
                                        required
                                        placeholder="Ex.: 2">
                            </div>

                            <!-- Diárias -->
                            <div class="mb-4">
                                <label for="diarias" class="form-label">
                                    Quantidade de diárias
                                </label>

                                <input type="number"
                                        id="diarias"
                                        class="form-control"
                                        min="1"
                                        required
                                        placeholder="Ex.: 3">
                            </div>

                            <button type="submit"
                                    class="btn w-100">
                                Calcular hospedagem
                            </button>

                        </form>

                        <!-- Resultado -->
                        <div id="resultado"
                                class="mt-4"
                                aria-live="polite">
                        </div>

                    </div>
                </div>
            </div>
        </div>
