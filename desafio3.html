    <main class="container py-4 transition-main" id="swup">

        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">

                <div class="card shadow p-4">
                    <div class="card-body p-4">

                        <h1 class="h3 text-center mb-2">
                            Consumo de Serviços
                        </h1>

                        <p class="text-muted text-center mb-4">
                            Calcule o valor dos serviços consumidos pelo hóspede.
                        </p>

                        <form id="formServico">

                            <div class="mb-3">
                                <label for="nome" class="form-label">
                                    Nome do hóspede
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="nome"
                                    placeholder="Digite o nome"
                                    required>
                            </div>


                            <div class="mb-3">

                                <label for="servico" class="form-label">
                                    Serviço
                                </label>

                                <select
                                    class="form-select"
                                    id="servico"
                                    required>

                                    <option value="">
                                        Selecione um serviço
                                    </option>

                                    <option value="25">
                                        Café da manhã - R$ 25,00
                                    </option>

                                    <option value="40">
                                        Almoço - R$ 40,00
                                    </option>

                                    <option value="45">
                                        Jantar - R$ 45,00
                                    </option>

                                    <option value="85">
                                        refeição completa - R$ 85,00
                                    </option>

                                    <option value="30">
                                        Serviço de quarto - R$ 30,00
                                    </option>

                                    <option value="20">
                                        Lavanderia - R$ 20,00
                                    </option>

                                    <option value="135">
                                        Serviço Completo - R$ 135,00
                                    </option>

                                </select>

                            </div>


                            <div class="mb-4">
                                <label for="quantidade" class="form-label">
                                    Quantidade
                                </label>

                                <input
                                    type="number"
                                    class="form-control"
                                    id="quantidade"
                                    min="1"
                                    value="1"
                                    required>
                            </div>

                            <button
                                type="submit"
                                class="btn w-100">
                                Calcular consumo
                            </button>

                        </form>

                        <div
                            id="resultado"
                            class="mt-4"
                            aria-live="polite">
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </main>
