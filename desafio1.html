    <!-- Conteúdo -->
    <main class="container py-4 transition-main" id="swup">

        <div class="row justify-content-center">
            <div class="col-sm-12 col-md-8 col-lg-6">

                <div class="card shadow p-4">
                    <div class="card-body p-4">

                        <h1 class="h3 text-center mb-2">
                            Reserva de Quartos
                        </h1>

                        <p class="text-muted text-center mb-4">
                            Preencha os dados para realizar
                            uma reserva no hotel.
                        </p>

                        <!-- Formulário -->
                        <form id="formReserva">

                            <div class="mb-3">
                                <label for="nome" class="form-label">
                                    Nome do hóspede titular
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="nome"
                                    placeholder="Digite o nome completo"
                                    required>
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label">
                                    E-mail
                                </label>

                                <input
                                    type="email"
                                    class="form-control"
                                    id="email"
                                    placeholder="Digite o e-mail"
                                    required>
                            </div>        

                            <div class="mb-3">
                                <label for="quarto" class="form-label">
                                    Tipo de quarto
                                </label>

                                <select
                                    class="form-select"
                                    id="quarto"
                                    required>

                                    <option value="">
                                        Selecione um quarto
                                    </option>

                                    <option value="individual">
                                        Quarto Individual - R$ 100
                                    </option>

                                    <option value="triplo">
                                        Quarto Triplo Luxo - R$ 150
                                    </option>

                                    <option value="duplo">
                                        Quarto Duplo - R$ 180
                                    </option>

                                    <option value="casal">
                                        Quarto com Cama de Casal - R$ 200
                                    </option>

                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="pessoas" class="form-label">
                                    Quantidade de pessoas
                                </label>

                                <input
                                    type="number"
                                    class="form-control"
                                    id="pessoas"
                                    min="1"
                                    max="3"
                                    placeholder="Ex.: 2"
                                    required>
                            </div>

                            <div class="mb-4">
                                <label for="diarias" class="form-label">
                                    Quantidade de diárias
                                </label>

                                <input
                                    type="number"
                                    class="form-control"
                                    id="diarias"
                                    min="1"
                                    placeholder="Ex.: 3"
                                    required>
                            </div>

                            <!-- Botão -->
                            <button
                                type="submit"
                                class="btn w-100">
                                Reservar quarto
                            </button>

                        </form>

                        <!-- Resultado -->
                        <div
                            id="resultado"
                            class="mt-4"
                            aria-live="polite">
                        </div>

                    </div>
                </div>
            </div>
        </div>

    </main>
